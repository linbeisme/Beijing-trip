<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="北京行程">
<meta name="theme-color" content="#0e1015">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>北京 2026 深度考察 · 互動行程</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#0e1015; --panel:#161922; --panel2:#1d212d; --line:#2a2f3d;
  --text:#e9e7e0; --muted:#9aa0ad; --gold:#d9a94c; --red:#c84b4b;
  --green:#5fb878; --blue:#5b9bd5; --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
body.light{--bg:#f3f1ea;--panel:#ffffff;--panel2:#f1eee5;--line:#d9d4c7;--text:#272419;--muted:#6f6c61;--gold:#a8851f;--red:#b13a3a;--green:#2e7d4f;--blue:#2a6db5;--shadow:0 4px 16px rgba(0,0,0,.10)}
body.light .notice{background:#faf3df;border-color:#e2cf9a;color:#6b5618}
body.light #legend{background:rgba(255,255,255,.92)}
body.light .thumb{background:linear-gradient(135deg,#e7e2d2,#f1eee5)}
body.light .tab.active{background:linear-gradient(135deg,#f6ecd2,#fffdf6)}
.tool{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.8rem}
.tool:hover{border-color:var(--gold)}
body{background:var(--bg);color:var(--text);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Segoe UI",sans-serif;line-height:1.55}
header{padding:22px 26px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;justify-content:space-between}
header h1{font-size:1.35rem;font-weight:700;letter-spacing:.5px}
header h1 span{color:var(--gold)}
header .sub{color:var(--muted);font-size:.85rem}
#tabs{display:flex;gap:8px;padding:14px 26px;flex-wrap:wrap;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1000}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:.88rem;transition:.15s}
.tab small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px}
.tab:hover{border-color:var(--gold)}
.tab.active{background:linear-gradient(135deg,#2a2417,#1d212d);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.tab.active small{color:var(--gold)}
#addBtn{margin-left:auto;background:var(--gold);color:#1a1405;border:none;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:.88rem}
#addBtn:hover{filter:brightness(1.1)}
main{display:grid;grid-template-columns:minmax(390px,46%) 1fr;gap:0;height:calc(100vh - 128px)}
#left{overflow-y:auto;padding:18px 20px 60px 26px}
#mapWrap{position:relative;border-left:1px solid var(--line)}
#map{height:100%;width:100%;background:#0e1015}
.dayHead{margin-bottom:14px}
.dayHead h2{font-size:1.12rem;color:var(--gold)}
.dayHead .meta{color:var(--muted);font-size:.84rem;margin-top:3px}
.notice{background:#241d10;border:1px solid #4d3c17;border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:.82rem;margin:10px 0;color:#e6d3a3}
.budget{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.8rem;color:var(--green);margin-top:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.card:hover{border-color:var(--gold)}
.card.focus{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.cardTop{display:flex;gap:0}
.thumb{width:118px;min-height:118px;flex-shrink:0;background:linear-gradient(135deg,#23283a,#161922);display:flex;align-items:center;justify-content:center;font-size:2rem;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cbody{padding:12px 14px;flex:1;min-width:0}
.crow1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{background:var(--gold);color:#1a1405;font-weight:800;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;flex-shrink:0}
.ctime{color:var(--gold);font-weight:700;font-size:.85rem}
.cname{font-weight:700;font-size:.98rem}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-size:.74rem;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:2px 8px;color:var(--muted)}
.tag.price{color:var(--green);border-color:#2c4435}
.tag.hours{color:var(--blue);border-color:#2c3a4a}
.tag.alert{color:#e8b54a;border-color:#5a4517}
.cdesc{color:var(--muted);font-size:.82rem;margin-top:7px}
.sees{margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.sees b{font-size:.76rem;color:var(--gold)}
.sees ul{margin:4px 0 0 16px}
.sees li{font-size:.78rem;color:var(--muted);margin:2px 0}
.clinks{margin-top:7px;font-size:.78rem}
.clinks a{color:var(--blue);text-decoration:none;margin-right:12px}
.clinks a:hover{text-decoration:underline}
.delBtn{float:right;background:none;border:1px solid var(--red);color:var(--red);border-radius:6px;font-size:.72rem;padding:2px 8px;cursor:pointer}
.leg{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 10px;color:var(--muted);font-size:.8rem}
.leg .dotline{display:flex;flex-direction:column;align-items:center;width:22px}
.leg .dotline i{display:block;width:2px;height:26px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 8px)}
.leg .mico{font-size:1rem}
.leg a{color:var(--blue);text-decoration:none}
.leg a:hover{text-decoration:underline}
.leg .alt{color:var(--muted);font-size:.76rem;margin-top:2px;opacity:.85}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:3000}
#modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(480px,92vw);padding:22px;box-shadow:var(--shadow)}
.mbox h3{color:var(--gold);margin-bottom:4px}
.mbox p.hint{color:var(--muted);font-size:.8rem;margin-bottom:14px}
.mbox label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.mbox input,.mbox select,.mbox textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-size:.9rem;font-family:inherit;resize:vertical}
.mbox input:focus,.mbox select:focus,.mbox textarea:focus{outline:none;border-color:var(--gold)}
.mrow{display:flex;gap:10px}
.mrow>div{flex:1}
.mActions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.mActions button{border-radius:8px;padding:9px 18px;cursor:pointer;font-size:.88rem;border:1px solid var(--line)}
#mCancel{background:none;color:var(--muted)}
#mSave{background:var(--gold);color:#1a1405;font-weight:700;border:none}
#mStatus{font-size:.8rem;color:var(--blue);margin-top:10px;min-height:18px}
.leaflet-container{font:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel2);color:var(--text);box-shadow:var(--shadow)}
.leaflet-popup-content{font-size:.85rem;margin:10px 12px}
.numIcon{background:var(--gold);color:#1a1405;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid #fff3;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.numIcon.food{background:var(--red);color:#fff}
.numIcon.hotel{background:var(--blue);color:#fff}
#legend{position:absolute;bottom:14px;left:14px;z-index:900;background:rgba(22,25,34,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.74rem;color:var(--muted)}
#legend b{color:var(--text)}
@media(max-width:900px){
  main{display:block;height:auto}
  #left{height:auto;max-height:none}
  #mapWrap{height:55vh;border-left:none;border-top:1px solid var(--line)}
}
@media(max-width:600px){
  header{padding:12px 14px 8px;gap:8px}
  header h1{font-size:1.02rem}
  header .sub{font-size:.76rem}
  #tabs{padding:10px 12px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{flex-shrink:0;padding:8px 11px;font-size:.82rem}
  #addBtn{flex-shrink:0;margin-left:4px}
  #left{padding:12px 12px 30px}
  .thumb{width:86px;min-height:86px;font-size:1.5rem}
  .cbody{padding:10px 11px}
  .cname{font-size:.92rem}
  .delBtn{padding:4px 9px;font-size:.76rem}
  #mapWrap{height:62vh}
  .mbox{max-height:88vh;overflow-y:auto;padding:16px}
  .mrow{flex-direction:column;gap:0}
  #legend{font-size:.66rem;padding:6px 9px;max-width:78%}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>北京 2026 <span>深秋深度考察</span> · 互動行程</h1>
    <div class="sub">11月8日（日）– 11月12日（四）｜中軸線 · 皇家園林 · 長城 · 胡同｜台胞證實名預約版</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span class="sub">住宿：北京東方君悅大酒店（王府井）</span>
    <button class="tool" id="themeBtn">☀️ 日間模式</button>
    <button class="tool" id="expBtn">⬇ 匯出</button>
    <button class="tool" id="impBtn">⬆ 匯入</button>
    <input type="file" id="impFile" accept=".json,application/json" style="display:none">
  </div>
</header>

<div id="tabs"></div>

<main>
  <div id="left"></div>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="legend"><b>圖例</b>　● 金=景點　● 紅=餐廳　● 藍=酒店/起點　— 實線=步行/車　- - 虛線=地鐵/公車</div>
  </div>
</main>

<div id="modal">
  <div class="mbox">
    <h3>＋ 新增活動 / 景點</h3>
    <p class="hint">輸入名稱後自動從 OpenStreetMap 取得座標、從維基百科抓取簡介與圖片。新增項目儲存在本機瀏覽器，可用右上「⬇ 匯出」備份、換裝置後「⬆ 匯入」還原。</p>
    <div class="mrow">
      <div><label>加入哪一天</label><select id="fDay"></select></div>
      <div><label>時間（如 16:30）</label><input id="fTime" placeholder="16:30"></div>
    </div>
    <div id="advFields">
    <label>名稱（中文較易搜尋，如「南鑼鼓巷」）</label>
    <input id="fName" placeholder="景點 / 餐廳 / 地點名稱">
    <div class="mrow">
      <div><label>類型</label><select id="fType"><option value="sight">景點</option><option value="food">餐飲</option><option value="other">其他</option></select></div>
      <div><label>官網 / 網址（選填）</label><input id="fUrl" placeholder="https://..."></div>
    </div>
    <div class="mrow">
      <div><label>建議停留（選填）</label><input id="fDur" placeholder="例：1.5 小時"></div>
      <div><label>門票/費用（選填）</label><input id="fFee" placeholder="例：¥20；免費可留空"></div>
    </div>
    <label>必看亮點（選填，每行一項）</label>
    <textarea id="fSees" rows="3" placeholder="例：&#10;鐘樓大鐘&#10;胡同門墩與門樓"></textarea>
    <label>營業時間/備註（選填）</label>
    <input id="fNote" placeholder="例：09:00–17:00，週一閉館">
    </div>
    <div id="mStatus"></div>
    <div class="mActions">
      <button id="mReset" style="display:none;background:none;color:var(--red);border:1px solid var(--red);margin-right:auto">還原預設</button>
      <button id="mCancel">取消</button>
      <button id="mSave">查詢並加入</button>
    </div>
  </div>
</div>

function loadCustom(){

/* overrides: time/day changes to built-in stops */
const LSKEY_OV = "bj2026_overrides_v1";
let overrides = (function(){try{return JSON.parse(localStorage.getItem(LSKEY_OV))||{}}catch(e){return{}}})();
function saveOverrides(){ try{localStorage.setItem(LSKEY_OV, JSON.stringify(overrides))}catch(e){} }

/* stable ids for built-in stops + lookup of default consecutive legs */
const defaultLegs = {};
DAYS.forEach((dd,di)=>{
  dd.stops.forEach((s,i)=>{ s.bid = "b"+di+"_"+i; });
  dd.stops.forEach((s,i)=>{ const n=dd.stops[i+1]; if(n&&s.travel) defaultLegs[s.bid+">"+n.bid]=s.travel; });
});

function stopsForDay(d){
  const out = [];
  DAYS.forEach((dd,di)=>{
    dd.stops.forEach(s=>{
      const ov = overrides[s.bid]||{};
      if(ov.archived) return;
      const effDay = (ov.day===undefined)?di:ov.day;
      if(effDay!==d) return;
      out.push({...s, t:(ov.t||s.t), movedDay:(ov.day!==undefined&&ov.day!==di), retimed:!!ov.t});
    });
  });
  (customStops[d]||[]).forEach(s=>out.push({...s, custom:true}));
  out.sort((a,b)=> timeKey(a.t)-timeKey(b.t));
  return out;
}

/* dynamic leg resolution: use hand-written leg when the pair matches the
   default sequence; otherwise auto-generate from distance (needs internet
   only for the map geometry — estimates work offline) */
function haversineKm(a,b){
  const R=6371, dLa=(b[0]-a[0])*Math.PI/180, dLo=(b[1]-a[1])*Math.PI/180;
  const la1=a[0]*Math.PI/180, la2=b[0]*Math.PI/180;
  const h=Math.sin(dLa/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
/* WGS-84 → GCJ-02 conversion so Amap links land on the right spot */
function wgs2gcj(lat,lng){
  const a=6378245, ee=0.00669342162296594323;
  const tLat=(x,y)=>{let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
    r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r;};
  const tLng=(x,y)=>{let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
    r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r;};
  const dLat0=tLat(lng-105,lat-35), dLng0=tLng(lng-105,lat-35);
  const radLat=lat/180*Math.PI;
  let magic=Math.sin(radLat); magic=1-ee*magic*magic;
  const sqrtMagic=Math.sqrt(magic);
  const dLat=(dLat0*180)/((a*(1-ee))/(magic*sqrtMagic)*Math.PI);
  const dLng=(dLng0*180)/(a/sqrtMagic*Math.cos(radLat)*Math.PI);
  return [lat+dLat, lng+dLng];
}
function resolveLeg(a,b){
  if(!a||!b) return null;
  if(a.bid && b.bid && defaultLegs[a.bid+">"+b.bid]) return {...defaultLegs[a.bid+">"+b.bid], generated:false};
  if(!a.coords || !b.coords) return null;
  const km = haversineKm(a.coords, b.coords);
  if(km<1.3) return {mode:"walk", label:`自動路段：步行約 ${(km*1000).toFixed(0)} 公尺`, mins:Math.max(3,Math.round(km*13)), generated:true};
  return {mode:"car", label:`自動路段：計程車/滴滴約 ${km.toFixed(1)} 公里`, mins:Math.round(km*3+6), generated:true,
    alt:{mode:"metro", label:"地鐵備案：點 Google路線 查轉乘（在地以高德為準）", mins:Math.round(km*4+15)}};
}
function timeKey(t){
  const m = (t||"").match(/(\d{1,2}):(\d{2})/);
  return m ? (+m[1])*60+(+m[2]) : 9999;
}

function archiveBuiltin(bid){

function restoreBuiltin(bid){

/* ============ IMAGES (Wikipedia) ============ */
async function loadImage(s, idx){
  if(!s.wiki && !s.imgUrl) return;
  const key = s.imgUrl || s.wiki;
  if(imgCache[key]===false) return;
  let src = s.imgUrl || imgCache[key];
  if(!src){
    try{
      const r = await fetch(`https://zh.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(s.wiki)}`);
      if(!r.ok) throw 0;
      const j = await r.json();
      src = (j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source);
      if(!src) throw 0;
      imgCache[key]=src;
    }catch(e){ imgCache[key]=false; return; }
  }
  const el = document.getElementById("thumb"+idx);
  if(el){
    const img = new Image();
    img.onload = ()=>{ el.innerHTML=""; el.appendChild(img); };
    img.src = src;
  }
}

/* ============ MAP ============ */
function initMap(){
  map = L.map("map",{zoomControl:true}).setView([39.92,116.40],12);
  baseTile = L.tileLayer(tileUrls[theme],{
    attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:"abcd", maxZoom:19
  }).addTo(map);
  layerGroup = L.layerGroup().addTo(map);
}

function renderMap(){
  layerGroup.clearLayers();
  const isArch = currentDay==="arch";
  const stops = isArch ? archivedList() : stopsForDay(currentDay);
  const pts = [];
  stops.forEach((s,idx)=>{
    if(!s.coords) return;
    pts.push({s, idx});
    const cls = s.type==="food"?"food":(s.type==="hotel"?"hotel":"");
    const icon = L.divIcon({className:"", html:`<div class="numIcon ${cls}" style="width:26px;height:26px;font-size:13px">${idx+1}</div>`, iconSize:[26,26], iconAnchor:[13,13]});
    L.marker(s.coords,{icon}).addTo(layerGroup)
      .bindPopup(`<b>${idx+1}. ${s.name}</b><br>${s.t||""}${s.price?`<br>💴 ${s.price}`:""}${s.hours?`<br>🕐 ${s.hours}`:""}`)
      .on("click",()=>highlightCard(idx));
  });
  // legs (not in archive view)
  if(!isArch){
    for(let i=0;i<pts.length-1;i++){
      const a = pts[i], b = pts[i+1];
      const lg = resolveLeg(a.s, b.s);
      drawLeg(a.s.coords, b.s.coords, lg ? lg.mode : "walk");
    }
  }
  if(pts.length){
    map.fitBounds(L.latLngBounds(pts.map(p=>p.s.coords)).pad(0.18));
  }
}

function drawLeg(from, to, mode){
  const style = (mode==="metro"||mode==="bus")
    ? {color:"#5b9bd5", weight:3, dashArray:"6 8", opacity:.8}
    : {color:"#d9a94c", weight:3, opacity:.85};
  const line = L.polyline([from,to], style).addTo(layerGroup);
  if(mode==="walk"||mode==="car"){
    const profile = mode==="car"?"driving":"foot";
    fetch(`https://router.project-osrm.org/route/v1/${profile}/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`)
      .then(r=>r.json())
      .then(j=>{
        if(j.routes && j.routes[0]){
          const coords = j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
          line.setLatLngs(coords);
        }
      }).catch(()=>{});
  }
}

function focusStop(idx){
  const stops = currentDay==="arch" ? archivedList() : stopsForDay(currentDay);
  const s = stops[idx];
  if(s && s.coords){ map.flyTo(s.coords, Math.max(map.getZoom(),15), {duration:.6}); }
  highlightCard(idx);
}
function highlightCard(idx){
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("focus"));
  const el = document.getElementById("card"+idx);
  if(el){ el.classList.add("focus"); el.scrollIntoView({behavior:"smooth", block:"nearest"}); }
}

const modal = document.getElementById("modal");
let editCid = null, editBid = null;
function openModal(isEdit){
  const sel = document.getElementById("fDay");
  sel.innerHTML = DAYS.map((d,i)=>`<option value="${i}" ${i===currentDay?"selected":""}>第${["一","二","三","四","五"][i]}天 ${d.date} ${d.dow}</option>`).join("");

function editBuiltin(bid){
  let base=null, di=null;
  DAYS.forEach((dd,i)=>dd.stops.forEach(s=>{ if(s.bid===bid){base=s;di=i;} }));
  if(!base) return;
  editBid = bid; editCid = null;
  openModal(true);
  document.querySelector(".mbox h3").textContent = "✎ 調整時間／日期：" + base.name;
  document.getElementById("advFields").style.display = "none";
  document.getElementById("mReset").style.display = overrides[bid] ? "inline-block" : "none";
  const ov = overrides[bid]||{};
  document.getElementById("fDay").value = (ov.day===undefined)?di:ov.day;
  document.getElementById("fTime").value = ov.t || base.t || "";
}
document.getElementById("mReset").onclick = ()=>{
  if(editBid){ delete overrides[editBid]; saveOverrides(); }
  editBid = null;
  modal.classList.remove("open");
  renderList(); renderMap();
};
function clearForm(){
  ["fTime","fName","fUrl","fDur","fFee","fSees","fNote"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("fType").value = "sight";
}
function editCustom(cid){
  let found=null, day=null;
  for(const d in customStops){
    const s=(customStops[d]||[]).find(x=>x.cid===cid);
    if(s){found=s;day=+d;break}
  }
  if(!found) return;
  editCid = cid; editBid = null;
  openModal(true);
  document.getElementById("fDay").value = day;
  document.getElementById("fTime").value = found.t==="—"?"":found.t;
  document.getElementById("fName").value = found.name;
  document.getElementById("fType").value = found.type||"sight";
  document.getElementById("fUrl").value = found.url||"";
  document.getElementById("fDur").value = found.dur||"";
  document.getElementById("fFee").value = found.price||"";
  document.getElementById("fSees").value = (found.sees||[]).join("\n");
  document.getElementById("fNote").value = found.hours||"";
}
document.getElementById("mCancel").onclick = ()=>modal.classList.remove("open");
modal.onclick = e=>{ if(e.target===modal) modal.classList.remove("open"); };

document.getElementById("mSave").onclick = async ()=>{
  // built-in stop: only time/day are adjustable
  if(editBid){
    const day = +document.getElementById("fDay").value;
    const t = document.getElementById("fTime").value.trim();
    let di = null;
    DAYS.forEach((dd,i)=>dd.stops.forEach(s=>{ if(s.bid===editBid) di=i; }));
    overrides[editBid] = {};
    if(t) overrides[editBid].t = t;
    if(day!==di) overrides[editBid].day = day;
    if(!overrides[editBid].t && overrides[editBid].day===undefined) delete overrides[editBid];
    saveOverrides();
    modal.classList.remove("open");
    editBid = null;
    selectDay(day);
    return;
  }
  const name = document.getElementById("fName").value.trim();
  const day = +document.getElementById("fDay").value;
  const time = document.getElementById("fTime").value.trim() || "—";
  const type = document.getElementById("fType").value;
  const url = document.getElementById("fUrl").value.trim();
  const note = document.getElementById("fNote").value.trim();
  const dur = document.getElementById("fDur").value.trim();
  const fee = document.getElementById("fFee").value.trim();
  const seesArr = document.getElementById("fSees").value.split("\n").map(x=>x.trim()).filter(Boolean);
  const status = document.getElementById("mStatus");
  if(!name){ status.textContent = "請輸入名稱"; return; }

  // if editing: pull the old entry out (allows moving between days)
  let prev = null;
  if(editCid){
    for(const d in customStops){
      const i = (customStops[d]||[]).findIndex(x=>x.cid===editCid);
      if(i>-1){ prev = customStops[d][i]; customStops[d].splice(i,1); break; }
    }
  }

  let coords = (prev && prev.name===name) ? prev.coords : null;
  let wiki   = (prev && prev.name===name) ? prev.wiki   : null;
  let imgUrl = (prev && prev.name===name) ? prev.imgUrl : null;
  let desc   = (prev && prev.name===name && prev.desc) ? prev.desc : "";
  if(coords){ status.textContent = "💾 儲存中…"; }
  else { status.textContent = "🔍 正在查詢座標與資料…"; }
  let autoHours="", autoFee="", autoUrl="", autoSees=null;
  if(!coords){
    // 1) geocode via Nominatim (extratags carries OSM opening_hours / fee / website)
    const harvest = (r0)=>{
      coords = [+r0.lat, +r0.lon];
      const ex = r0.extratags || {};
      if(ex.opening_hours) autoHours = ex.opening_hours;
      if(ex.charge) autoFee = ex.charge;
      else if(ex.fee==="yes") autoFee = "收費（金額請查官網）";
      else if(ex.fee==="no") autoFee = "免費";
      const w = ex.website || ex["contact:website"];
      if(w) autoUrl = w;
    };
    try{
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&extratags=1&accept-language=zh&viewbox=115.7,40.6,117.4,39.4&bounded=0&q=${encodeURIComponent(name+" 北京")}`);
      const j = await r.json();
      if(j[0]) harvest(j[0]);
    }catch(e){}
    if(!coords){
      try{
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&extratags=1&accept-language=zh&q=${encodeURIComponent(name)}`);
        const j = await r.json();
        if(j[0]) harvest(j[0]);
      }catch(e){}
    }
    // 2) wikipedia summary → description + image + auto-highlights
    try{
      const r = await fetch(`https://zh.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`);
      if(r.ok){
        const j = await r.json();
        if(j.extract){
          desc = j.extract.slice(0,180);
          const sents = j.extract.split(/[。！；]/).map(x=>x.trim()).filter(x=>x.length>=10).slice(0,3);
          if(sents.length) autoSees = sents.map(x=>x+"。");
        }
        if(j.thumbnail) imgUrl = j.thumbnail.source;
        wiki = name;
      }
    }catch(e){}
    const got = [];
    if(autoHours) got.push("營業時間");
    if(autoFee) got.push("費用");
    if(autoUrl) got.push("官網");
    if(desc) got.push("簡介");
    if(got.length) status.textContent = "✅ 已自動帶入：" + got.join("、") + "（可隨時用 ✎ 編輯修改）";
  }

  if(!coords){
    status.textContent = "⚠️ 找不到座標，已加入清單但不顯示於地圖（可用「✎ 編輯」換更精確名稱重試）。";
  }
  const entry = {
    cid: editCid || ("c"+Date.now()),
    t:time, name, type, icon: type==="food"?"🍽️":"📍",
    coords, wiki, imgUrl,
    desc: desc || "",
    url: url || autoUrl || "",
    hours: note || autoHours || "",
    price: fee || autoFee || "",
    dur,
    sees: seesArr.length ? seesArr : (autoSees && autoSees.length ? autoSees : undefined)
  };
  if(!customStops[day]) customStops[day] = [];
  customStops[day].push(entry);
  saveCustom();
  const hadCoords = !!coords;
  setTimeout(()=>{
    modal.classList.remove("open");
    clearForm(); editCid = null;
    if(day===currentDay){ renderList(); renderMap(); } else selectDay(day);
  }, hadCoords?300:1600);
};

document.getElementById("expBtn").onclick = ()=>{
  const blob = new Blob([JSON.stringify({app:"beijing2026", v:2, custom:customStops, overrides}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");

  a.click();

document.getElementById("impBtn").onclick = ()=>document.getElementById("impFile").click();
document.getElementById("impFile").onchange = (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const j = JSON.parse(reader.result);
      const data = j.custom || j;
      if(typeof data !== "object") throw 0;
      // merge: imported entries are added; duplicates (same cid) are replaced
      for(const d in data){
        if(!Array.isArray(data[d])) continue;
        if(!customStops[d]) customStops[d] = [];
        data[d].forEach(s=>{
          if(!s || !s.name) return;
          customStops[d] = customStops[d].filter(x=>x.cid!==s.cid);
          customStops[d].push(s);
        });
      }
      if(j.overrides && typeof j.overrides==="object"){
        Object.assign(overrides, j.overrides);
        saveOverrides();
      }
      saveCustom(); buildTabs(); renderList(); renderMap();
      alert("匯入成功！自訂活動與時間/封存調整已合併。");
    }catch(err){ alert("匯入失敗：檔案格式不正確。請選擇先前由本應用匯出的 JSON 檔。"); }
    e.target.value = "";
  };
  reader.readAsText(f);
};

/* ============ THEME ============ */
function applyTheme(){
  document.body.classList.toggle("light", theme==="light");
  document.getElementById("themeBtn").textContent = theme==="light" ? "🌙 夜間模式" : "☀️ 日間模式";
  if(baseTile) baseTile.setUrl(tileUrls[theme]);
  try{ localStorage.setItem("bj2026_theme", theme); }catch(e){}
}
document.getElementById("themeBtn").onclick = ()=>{
  theme = (theme==="light") ? "dark" : "light";
  applyTheme();
};

function removeCustom(cid){
  for(const d in customStops){
    customStops[d] = customStops[d].filter(s=>s.cid!==cid);
  }
  saveCustom(); renderList(); renderMap();
}

/* ============ INIT ============ */
initMap();
applyTheme();
selectDay(0);

/* ============ CLOUD SYNC: auto-load my-customizations.json (e.g., on GitHub Pages) ============ */
(async function loadShared(){
  try{
    const r = await fetch("my-customizations.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const j = await r.json();
    let changed = false;
    const data = j.custom || {};
    for(const d in data){
      if(!Array.isArray(data[d])) continue;
      if(!customStops[d]) customStops[d] = [];
      data[d].forEach(s=>{
        if(!s || !s.name) return;
        customStops[d] = customStops[d].filter(x=>x.cid!==s.cid);
        customStops[d].push(s);
        changed = true;
      });
    }
    if(j.overrides && typeof j.overrides==="object" && Object.keys(j.overrides).length){
      Object.assign(overrides, j.overrides);
      changed = true;
    }
    if(changed){
      saveCustom(); saveOverrides();
      buildTabs(); renderList(); renderMap();
      const tag = document.createElement("div");
      tag.textContent = "☁ 已載入 GitHub 共用自訂資料";
      tag.style.cssText = "position:fixed;bottom:16px;right:16px;background:var(--panel);border:1px solid var(--green);color:var(--green);padding:8px 14px;border-radius:10px;font-size:.8rem;z-index:4000;box-shadow:var(--shadow)";
      document.body.appendChild(tag);
      setTimeout(()=>tag.remove(), 4000);
    }
  }catch(e){ /* offline or opened as a local file — silently skip */ }
})();
</script>
